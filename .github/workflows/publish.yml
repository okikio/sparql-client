name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after all release gates pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  release:
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - run: mise run release-check
      - name: Publish JSR workspaces
        run: deno publish

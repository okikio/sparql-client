name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: deno ci
      - run: deno task verify

  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: deno ci
      - run: deno task package
      - run: deno task distribution
      - run: deno task consumer
      - run: deno task consumer:linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: copied-package-consumer-evidence
          path: .tmp/reports/consumer-copy
          include-hidden-files: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-evidence
          path: .tmp/reports/distribution.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-tarballs
          path: |
            .tmp/packages/*.tgz
            .tmp/packages/artifacts.json
          include-hidden-files: true

  consumers:
    name: Installed packages / ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: deno ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-tarballs
          path: .tmp/packages
      - run: deno task test:tooling
      - run: deno task consumer

  conformance:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: deno ci
      - run: deno task conformance:sync
      - run: deno task conformance
      - run: deno task support
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: conformance-evidence
          path: .tmp/reports/conformance.json

  integration:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: deno ci
      - run: deno task integration
      - run: deno task test:upstream

  browser:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: okikio/opfs
          ref: 529c8493ae90a476405e6bf5a41d8c66bb6adbba
          path: .tmp/opfs-source
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: deno ci
      - run: deno task deps:ci
        working-directory: .tmp/opfs-source
      - run: deno run -A npm:@playwright/test@1.62.1 install --with-deps
      - run: deno task browser
        env:
          OPFS_SOURCE: .tmp/opfs-source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence
          if-no-files-found: error
          path: .tmp/reports/browser
          include-hidden-files: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failures
          path: .tmp/reports/browser/artifacts

  benchmark:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: deno ci
      - run: deno task bench:report
      - run: deno task bench:upstream:check
      - run: mkdir -p .tmp/reports/bench/upstream && deno task bench:upstream > .tmp/reports/bench/upstream/jena.json 2> .tmp/reports/bench/upstream/jena.stderr
        env:
          BENCH_FORMAT: json
      - run: deno task bench:types
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmark-evidence-${{ github.sha }}
          if-no-files-found: error
          path: |
            .tmp/reports/bench
            .tmp/reports/types
          include-hidden-files: true

  storage:
    name: Packed OPFS storage composition
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: okikio/opfs
          ref: 529c8493ae90a476405e6bf5a41d8c66bb6adbba
          path: .tmp/opfs-source
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: deno ci
      - run: deno task deps:ci && deno task pack:npm
        working-directory: .tmp/opfs-source
        env:
          RELEASE_VERSION: 0.0.0-quality
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-tarballs
          path: .tmp/packages
      - run: deno task integration:storage
        env:
          OPFS_SOURCE: .tmp/opfs-source
      - run: deno task consumer:storage
        env:
          OPFS_TARBALL: .tmp/opfs-source/.release/npm/okikio-opfs-0.0.0-quality.tgz
      - run: deno task bench:storage
        env:
          STORAGE_COLD_REPORT: .tmp/reports/storage-cold
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: storage-evidence
          path: .tmp/reports/storage-cold
          include-hidden-files: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: copied-storage-consumer-evidence
          path: .tmp/reports/consumer-copy
          include-hidden-files: true

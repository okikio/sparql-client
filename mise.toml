[tools]
deno = "2"
node = "26"
pnpm = "11"
bun = "1"

[tasks.fmt]
run = "deno task fmt --check"

[tasks.lint]
run = "deno task lint"

[tasks.check]
run = "deno task check"

[tasks.test]
run = "deno task test"

[tasks.verify]
depends = ["fmt", "lint", "check", "test"]

[tasks.integration]
run = "deno task integration"

[tasks.conformance-sync]
run = "deno task conformance:sync"

[tasks.conformance]
run = "deno task conformance"

[tasks.package]
run = "deno task package"

[tasks.consumer]
run = "deno task consumer"

[tasks.bench]
run = "deno task bench"

[tasks.bench-report]
run = "deno task bench:report"

[tasks.vocab-schema]
run = "deno task vocab:schema"

[tasks.release-check]
run = "deno task release-check"

[tasks.support]
run = "deno task support"

[tasks.distribution]
run = "deno task distribution"
